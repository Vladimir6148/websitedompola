name: Deploy Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web
        working-directory: apps/web
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://dompola.com
          VITE_API_URL: https://dompola-api.onrender.com
          VITE_STATIC_API: "true"
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Ensure SPA _redirects
        run: |
          cp apps/web/public/_redirects apps/web/dist/_redirects
          # Keep 404.html as extra fallback for some edge caches
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=dompola --commit-dirty=true
