name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web
        working-directory: apps/web
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://dompola.com
          VITE_API_URL: https://dompola-api.onrender.com
          VITE_STATIC_API: "true"
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          rm -f apps/web/dist/_redirects

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
