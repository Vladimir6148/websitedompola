services:
  - type: web
    name: dompola-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dompola-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        fromService:
          type: web
          name: dompola-api
          property: host

databases:
  - name: dompola-db
    plan: free
    region: frankfurt
    databaseName: dompola
    user: dompola
