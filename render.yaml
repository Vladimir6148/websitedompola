services:
  - type: web
    name: dompola-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dompola-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        fromService:
          type: web
          name: dompola-api
          property: host

  # Frontend CDN (works better with VPN than GitHub Pages IPs).
  - type: web
    name: dompola-web
    runtime: static
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE
        value: /
      - key: VITE_SITE_URL
        value: https://dompola.com
      - key: VITE_API_URL
        value: https://dompola-api.onrender.com
      - key: VITE_STATIC_API
        value: "true"
      - key: VITE_BUILD_ID
        value: render

databases:
  - name: dompola-db
    plan: free
    region: frankfurt
    databaseName: dompola
    user: dompola
