<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <title>ДОМПОЛА — напольные покрытия</title>
    <link rel="icon" href="/favicon.svg?v=house2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=house2" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=house2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=house2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=house2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=house2" />
    <link rel="preload" href="/data/home.json" as="fetch" crossorigin />
    <script>
      (function () {
        var BUILD = '__DOMPOLA_BUILD_ID__';
        var base = '__DOMPOLA_BASE_URL__';
        if (!BUILD || BUILD.indexOf('__DOMPOLA_') === 0) return;
        var url = base.replace(/\/?$/, '/') + 'build-id.txt?v=' + encodeURIComponent(BUILD);
        // Soft check in background — never block first paint
        fetch(url, { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (remote) {
            remote = String(remote || '').trim();
            if (remote && remote !== BUILD) {
              var key = 'dp_reload_' + remote;
              if (!sessionStorage.getItem(key)) {
                sessionStorage.setItem(key, '1');
                location.reload();
              }
            }
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
